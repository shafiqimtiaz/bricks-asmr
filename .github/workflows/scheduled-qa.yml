name: Scheduled QA

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/scheduled-qa.yml'
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'wrangler.jsonc'

permissions:
  contents: read

concurrency:
  group: bricks-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Regression tests
        run: npm test
      - name: Cloudflare Worker dry run
        run: npm run check
      - name: Start isolated local Worker
        run: |
          npx wrangler dev --local --port 8787 > wrangler-qa.log 2>&1 &
          echo $! > wrangler-qa.pid
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8787/ > /dev/null
      - name: Browser gameplay smoke test
        env:
          QA_BASE_URL: http://127.0.0.1:8787
        run: node tests/browser-smoke.mjs
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-${{ github.run_id }}
          path: |
            qa-artifacts/
            wrangler-qa.log
          if-no-files-found: ignore
          retention-days: 7
