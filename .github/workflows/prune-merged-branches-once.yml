name: Prune confirmed merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-merged-branches-once.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only unchanged, merged pull-request branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const fullName = owner + "/" + repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "closed", per_page: 100
            });
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const defaultBranch = context.payload.repository.default_branch;
            for (const branch of branches) {
              if (branch.protected || branch.name === defaultBranch) continue;
              const approved = pulls.find(pr =>
                pr.merged_at &&
                pr.head?.repo?.full_name === fullName &&
                pr.head.ref === branch.name &&
                pr.head.sha === branch.commit.sha
              );
              let safe = Boolean(approved);
              if (!safe) {
                const comparison = await github.rest.repos.compareCommits({
                  owner, repo, base: defaultBranch, head: branch.name
                });
                safe = comparison.data.ahead_by === 0;
              }
              if (!safe) {
                core.info("Preserving branch with unmerged commits: " + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({
                owner, repo, ref: "heads/" + branch.name
              });
              core.info("Deleted " + (approved ? "merged PR #" + approved.number : "branch without unique commits") + ": " + branch.name);
            }
