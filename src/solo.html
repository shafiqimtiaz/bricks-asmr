<script>
(() => {
// ---------- constants (logical 360x640) ----------
const arenaParam=new URLSearchParams(location.search).get('arena')||'';
const lockedArena=/^\d{3,4}$/.test(arenaParam)&&Number(arenaParam)>=256&&Number(arenaParam)<=2276?arenaLayout(Number(arenaParam)/640):null;
let arena = lockedArena||arenaLayout(window.innerWidth / window.innerHeight);
let W = arena.width, H = arena.height, CS = arena.cell, COLS = arena.cols, ROWS = arena.rows;
let GX = arena.gridX, GY = arena.gridY;
const SY = 614, SZONE = 572, PY = 536, PH = 7, MAX_BALLS = 2500;
let SX0 = Math.max(40, W * .11), SX1 = W - SX0;
let BR = CS * .45, PU_R = CS * 1.5;

// ---------- seeded RNG: game-core.js ----------
// ---------- URL state ----------
// A board is its seed. An old '#seed-3' link opens the seed and ignores the number.
const hm = /^#([a-z0-9]+)(?:-\d+)?$/i.exec(location.hash || '');
const randomSeed = () => Math.random().toString(36).slice(2, 8);
let seed = hm ? hm[1].toLowerCase() : randomSeed();
function syncURL(){try{const h='#'+seed;if(location.hash!==h)location.hash=h}catch(e){}}
window.addEventListener('hashchange',()=>{const m=/^#([a-z0-9]+)(?:-\d+)?$/i.exec(location.hash||'');if(m&&m[1].toLowerCase()!==seed){seed=m[1].toLowerCase();startBoard()}});

// ---------- canvas ----------
const wrap = document.getElementById('wrap'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scaleX = 1, scaleY = 1, bcv = document.createElement('canvas'), bctx = bcv.getContext('2d');
const gcv = document.getElementById('g');
const style = 'vintage';
const FX = {vintage: {k: 0.07, ch: 0.0018, vg: 0.45, br: 1.3}};
let gl = null, glTex, glU = {};
try {
  gl = gcv.getContext('webgl', {antialias: false, alpha: false});
  const sh = (t, src) => { const o = gl.createShader(t); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, `precision mediump float;uniform sampler2D t;uniform float k,ch,vg,br,tm;varying vec2 v;
void main(){vec2 c=v*2.-1.;c*=1.+k*c.yx*c.yx;vec2 uv=c*.5+.5;
if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){gl_FragColor=vec4(0.,0.,0.,1.);return;}

  if (luckyLeft > 0) act.push([PU_BY_ID.lucky, String(luckyLeft)]);
  if (act.length) {
    ctx.font = style === 'clean' ? 'bold 7px ui-monospace,monospace' : "5px 'Press Start 2P',monospace"; ctx.textAlign = 'left';
    let x = GX + 2, y = 566;
    for (const [d, v] of act) { const t = d.nm + ' ' + v, w = ctx.measureText(t).width + 10; if (x + w > W - 4) { x = GX + 2; y += 10; }
      ctx.fillStyle = d.c; ctx.fillRect(x, y - 2, 4, 4); ctx.fillText(t, x + 6, y); x += w; }
    ctx.textAlign = 'center';
  }
  ctx.font = style === 'clean' ? 'bold 11px ui-monospace,monospace' : "9px 'Press Start 2P',monospace";
  for (let k = floats.length - 1; k >= 0; k--) {
    const f = floats[k]; f.t -= 0.018 * fs; f.y -= 0.5 * fs;
    if (f.t <= 0) { floats.splice(k, 1); continue; }
    ctx.globalAlpha = Math.min(1, f.t);
    if (f.big) { ctx.save(); ctx.font = style === 'clean' ? 'bold 24px ui-monospace,monospace' : "15px 'Press Start 2P',monospace"; ctx.shadowColor = V ? '#ff71ce' : '#ffb000'; ctx.shadowBlur = style === 'clean' ? 0 : 12; ctx.fillStyle = f.c; ctx.fillText(f.s, f.x, f.y); ctx.restore(); }
    else { ctx.fillStyle = f.c; ctx.fillText(f.s, f.x, f.y); }
  }
  ctx.globalAlpha = 1;

  // combo meter
  if (combo >= 10) {
    comboPop *= Math.pow(.85, fs);
    ctx.font = (style === 'clean' ? 'bold ' + (14 + comboPop * 6) + 'px ui-monospace,monospace' : (10 + comboPop * 5) + "px 'Press Start 2P',monospace");
    ctx.fillStyle = combo >= 250 ? (V ? '#05ffa1' : '#ffd166') : combo >= 50 ? (V ? '#ff71ce' : '#ff9a5a') : '#fff';
    ctx.globalAlpha = .85; ctx.fillText('×' + combo, W - 34, GY + 14); ctx.globalAlpha = 1;
  }
  // big floats (milestones)
  // confetti
  if (conf.length) {
    for (let k = conf.length - 1; k >= 0; k--) { const c = conf[k]; c.vy += 3 * fs; c.x += c.vx / 60 * fs; c.y += c.vy / 60 * fs; c.r += c.vr / 60 * fs;
      if (c.y > H + 10) { conf[k] = conf[conf.length - 1]; conf.pop(); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-2, -1, 4, 2.5); ctx.restore(); }
  }
  // board intro card
  if (introT > 0) {
    introT -= fs / 60; const a = Math.min(1, introT / .4, (1.8 - introT) / .25), off = (1 - Math.min(1, (1.8 - introT) / .3)) * -60;
    ctx.globalAlpha = a * .8; ctx.fillStyle = V ? '#1a0533' : '#000'; ctx.fillRect(0, 210, W, 70);
    ctx.globalAlpha = a; ctx.fillStyle = V ? '#ff71ce' : style === 'clean' ? '#fff' : '#ffd166';
    ctx.font = style === 'clean' ? 'bold 22px ui-monospace,monospace' : "16px 'Press Start 2P',monospace";
    ctx.fillText(isDaily() ? 'DAILY CHALLENGE' : 'SEED ' + seed.toUpperCase(), W / 2 + off, 236);
    ctx.font = style === 'clean' ? '11px ui-monospace,monospace' : "7px 'Press Start 2P',monospace"; ctx.fillStyle = V ? '#9ff3ff' : '#ccc';
    ctx.fillText(ARCH_NAMES[archetype].toUpperCase() + (quad ? ' · QUAD' : '') + ' · LOST LIFE = ONE ROW DOWN', W / 2 - off, 262);
    ctx.globalAlpha = 1;
  }
  // danger vignette + flash
  if (danger > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
    g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, 'rgba(255,0,40,' + (danger * .45 * (.6 + .4 * Math.sin(performance.now() / 120))) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  if (flashW > 0) { ctx.fillStyle = crushed ? 'rgba(255,30,60,' + flashW + ')' : 'rgba(255,255,255,' + flashW + ')'; ctx.fillRect(0, 0, W, H); flashW *= Math.pow(.9, fs); if (flashW < .01) flashW = 0; }

  if (msgText) {
    const nl = msgText.split('\n').length, bh = crushed ? 52 : nl * 15 + 14;
    ctx.fillStyle = V ? 'rgba(13,2,33,.82)' : 'rgba(0,0,0,.72)'; ctx.fillRect(0, 470 - bh / 2 + (crushed ? 4 : 0), W, bh);
    ctx.font = style === 'clean' ? '12px ui-monospace,monospace' : "8px 'Press Start 2P',monospace";
    ctx.fillStyle = V ? '#ffe9fb' : '#eee';
    if (style !== 'clean') { ctx.shadowColor = V ? '#ff71ce' : 'rgba(255,255,255,.6)'; ctx.shadowBlur = 6; }
    if (crushed) { ctx.fillStyle = '#ff3355'; ctx.font = style === 'clean' ? 'bold 30px ui-monospace,monospace' : "22px 'Press Start 2P',monospace"; }
    msgText.split('\n').forEach((ln, j, a) => { ctx.fillText(ln, W / 2, 470 + (j - (a.length - 1) / 2) * (crushed && j === 0 ? 0 : 15) + (crushed && j ? 14 : 0)); if (crushed && j === 0) { ctx.fillStyle = '#eee'; ctx.font = style === 'clean' ? '12px ui-monospace,monospace' : "8px 'Press Start 2P',monospace"; } });
    ctx.shadowBlur = 0;
  }

  setText(hudLvl, isDaily() ? 'DAILY' : 'SEED ' + seed);
  if (hudLives.shown !== lives) { hudLives.shown = lives; const top = Math.max(MAX_LIVES, lives); let pips = ''; for (let k = 0; k < top; k++) pips += k < lives ? '<i></i>' : '<i class="off"></i>'; hudLives.innerHTML = pips; hudLives.setAttribute('aria-label', lives + ' lives'); }
  setText(hudTmr, fmtTime(runTime));
  const cleared = total ? Math.round(1000 * (1 - remaining / total)) / 1000 : 0;
  if (hudFill.shown !== cleared) { hudFill.shown = cleared; hudFill.style.transform = 'scaleX(' + cleared + ')'; }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (timerOn && !(fx.freeze > 0) && (state === 'play' || state === 'aim')) runTime += dt * 1000;
  notesThisFrame = 0;
  update(dt); render(dt * 60); postFX(now);
  if (danger > .2) { hbT -= dt; if (hbT <= 0) { hbT = danger > .7 ? .45 : .75; blip(55, .4, .13, 'sine'); setTimeout(() => { notesThisFrame = 0; blip(48, .3, .12, 'sine'); }, 110); } }
  perfEma += ((now - (frame.prev || now)) - perfEma) * .05; frame.prev = now;
  if (perfEma > 30 && balls.length > 600 && maxBalls > balls.length * .9) { maxBalls = S.maxBalls = Math.max(600, Math.floor(balls.length * .85)); if (!perfWarned) { perfWarned = true; showToast('smooth mode · ball cap ' + maxBalls); } }
  requestAnimationFrame(frame);
}

// ---------- input ----------
function toLogical(e){
  const r = wrap.getBoundingClientRect();
  let u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  if (useGL()) { const k = FX[style].k, cx = u * 2 - 1, cy = v * 2 - 1; u = (cx * (1 + k * cy * cy)) * .5 + .5; v = (cy * (1 + k * cx * cx)) * .5 + .5; }
  return [u * W, v * H];
}
function sliderTo(lx){ let t = Math.max(0, Math.min(1, (lx - SX0) / (SX1 - SX0))); if (fx.invert > 0) t = 1 - t; E.setPaddle(S, 'me', pw / 2 + t * (W - pw)); }
// board: tap = launch only; drag = relative fine-aim (never jumps, never moves the paddle)
let downX = 0, downLx = 0, downAim = 0, moved = false, sliding = false, onBoard = false;
wrap.addEventListener('pointerdown', e => {
  if (e.target.tagName !== 'CANVAS') return;
  audioInit(); downX = e.clientX; moved = false;
  const [lx, ly] = toLogical(e);
  sliding = ly >= SZONE; onBoard = !sliding; downLx = lx; downAim = aimAng;
  try { wrap.setPointerCapture(e.pointerId); } catch(_) {}
  if (sliding) sliderTo(lx);
});
wrap.addEventListener('pointermove', e => {
  if (!sliding && !onBoard) return;
  const [lx] = toLogical(e);
  if (sliding) { sliderTo(lx); return; }
  if (Math.abs(e.clientX - downX) > 8) moved = true;
  if (moved && state === 'aim') { E.setAim(S, 'me', downAim + (lx - downLx) * 0.006); aimAng = me.aim; }
});
function endPtr(e){
  if (!sliding && !onBoard) return;
  const wasBoard = onBoard; sliding = false; onBoard = false;
  if (!wasBoard || moved) return;
  if (state === 'aim') launch();
  else if (state === 'clear') newBoard();
  else if (state === 'over') startBoard();
}
wrap.addEventListener('pointerup', endPtr);
wrap.addEventListener('pointercancel', () => { sliding = false; onBoard = false; });
const keys = {};
window.addEventListener('keydown', e => {
  if(!document.getElementById('panel').hidden||!document.getElementById('hudMenu').hidden)return;
  audioInit(); keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { if (state === 'aim') launch(); else if (state === 'clear') newBoard(); else if (state === 'over') startBoard(); }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
setInterval(() => { const d = (fx.invert > 0 ? -14 : 14) * W / 360; if (keys.arrowleft || keys.a) E.setPaddle(S, 'me', px - d); if (keys.arrowright || keys.d) E.setPaddle(S, 'me', px + d); }, 16);

const toast = document.getElementById('toast');
function showToast(s, ms){ toast.textContent = s; toast.style.opacity = 1; clearTimeout(showToast.t); showToast.t = setTimeout(() => { toast.style.opacity = 0; toast.style.pointerEvents = 'none'; toast.style.userSelect = 'none'; }, ms || 2500); }
const SHARE_BASE = location.origin + location.pathname;
const shareURL = () => SHARE_BASE + '?arena=' + W + '#' + seed;
async function copyText(t, ok){
  try { await navigator.clipboard.writeText(t); showToast(ok); }
  catch(e) { showToast(t, 8000); toast.style.pointerEvents = 'auto'; toast.style.userSelect = 'text'; }
}
document.getElementById('share').onclick = () => { syncURL(); copyText(shareURL(), 'board link copied'); };
document.getElementById('daily').onclick = () => {
  const d = new Date(), ymd = d.toISOString().slice(0,10).replace(/-/g,'');
  seed = 'd' + ymd; startBoard(); showToast('daily challenge · ' + d.toDateString().slice(4, 10));
};
document.getElementById('newb').onclick = () => { newBoard(); showToast('new seed ' + seed); };


function fmtTime(ms){const m=Math.floor(ms/60000),s=(ms-m*60000)/1000;return m+':'+(s<10?'0':'')+s.toFixed(2);}
const boardId=()=>seed+'-'+style+(W===360?'':'-a'+W);
const P=id=>document.getElementById(id);
const SNAME={vintage:'CRT'};
let panelMode=null,lastTime=0,lastNote='',boardRows=[],boardKey='',boardStatus='loading',boardSeq=0,localBest={},myId='',myName='';
try{
 myId=localStorage.getItem('brick-asmr-player-id')||'';
 if(!/^[0-9a-f-]{36}$/i.test(myId)){myId=crypto.randomUUID();localStorage.setItem('brick-asmr-player-id',myId);}
 myName=localStorage.getItem('brick-asmr-player-name')||'';
 localBest=JSON.parse(localStorage.getItem('brick-asmr-best')||'{}')||{};
}catch(e){myId=crypto.randomUUID();}
if(!/^[\p{L}\p{N} _.-]{2,24}$/u.test(myName))myName='Brick-'+myId.slice(0,6).toUpperCase();
function myBest(key){return Number.isFinite(localBest[key])?localBest[key]:undefined;}
function setLinks(){P('pfull').href='/leaderboard';P('pname').textContent='Player: '+myName+' ✎';}
async function loadBoard(){
 const seq=++boardSeq;boardKey=boardId();boardStatus='loading';boardRows=[];renderPanel();
 try{
  const res=await fetch('/api/leaderboard?scope=world&offset=0',{cache:'no-store'});
  if(!res.ok)throw Error('Failed');
  const body=await res.json();
  if(seq!==boardSeq)return;
  boardRows=body.entries||[];boardStatus='ready';
 }catch(e){if(seq===boardSeq)boardStatus='error';}
 if(seq===boardSeq)renderPanel();
}
async function onClear(ms){
 const key=boardId(),old=myBest(key);
 lastTime=ms;
 const improved=old===undefined||ms<old;
 lastNote=improved?(old===undefined?'first clear!':'new best! · was '+fmtTime(old)):'best '+fmtTime(old);
 if(improved){localBest[key]=ms;try{localStorage.setItem('brick-asmr-best',JSON.stringify(localBest));}catch(e){}}
 showPanel('clear');
 try{
  const res=await fetch('/api/leaderboard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key,playerId:myId,name:myName,timeMs:ms})});
  if(!res.ok)throw Error('Rejected');
  if(key===boardId()){lastNote+=' · saved worldwide';await loadBoard();}
 }catch(e){if(key===boardId()){lastNote+=' · saved on device';boardStatus='error';renderPanel();}}
}
function showPanel(mode){panelMode=mode;P('panel').hidden=false;setLinks();renderPanel();loadBoard();}
function hidePanel(){panelMode=null;P('panel').hidden=true;}
function emptyBoard(note){const li=document.createElement('li');li.className='empty';li.textContent=note;P('plist').append(li);}
function renderPanel(){
 if(!panelMode)return;
 const mine=myBest(boardId());
 P('ptitle').textContent=(panelMode==='clear'?'CLEARED · ':'')+(isDaily()?'DAILY '+seed.slice(5,7)+'/'+seed.slice(7):'SEED '+seed)+' · CRT';
 P('ptime').textContent=panelMode==='clear'?fmtTime(lastTime):(mine!==undefined?fmtTime(mine):'--:--');
 P('pnote').textContent=(panelMode==='clear'?lastNote:(mine!==undefined?'your best time':'clear a board to set a record'))+(boardStatus==='error'?' · global rankings offline':'');
 P('pnext').hidden=panelMode!=='clear';P('pclose').hidden=panelMode==='clear';
 P('pbrag').hidden=panelMode!=='clear';setLinks();
 const ol=P('plist');ol.replaceChildren();
 if(boardStatus!=='ready'){emptyBoard(boardStatus==='loading'?'Loading world scores…':'World leaderboard unavailable');return;}
 if(!boardRows.length){emptyBoard('No world records yet · be first!');return;}
 for(const [index,row] of boardRows.slice(0,10).entries()){
  const li=document.createElement('li');if(row.playerId===myId)li.className='me';
  const a=document.createElement('span');a.className='rk';a.textContent='#'+(index+1);
  const b=document.createElement('span');b.className='nm';b.textContent=row.playerId===myId?'you':row.name;
  const c=document.createElement('span');c.textContent=fmtTime(row.timeMs);
  li.append(a,b,c);ol.append(li);
 }
}
P('pname').onclick=()=>{
 P('nameInput').value=myName;P('nameError').textContent='';P('nameModal').hidden=false;P('nameInput').focus();
};
function closeNameModal(){P('nameModal').hidden=true;P('pname').focus();}
P('nameCancel').onclick=closeNameModal;
P('nameModal').addEventListener('pointerdown',e=>{if(e.target===P('nameModal'))closeNameModal();});
P('nameForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const name=P('nameInput').value.trim().normalize('NFKC');
 if(!/^[\p{L}\p{N} _.-]{2,24}$/u.test(name)){P('nameError').textContent='Use 2–24 letters, numbers, spaces, _ . or -';return;}
 myName=name;try{localStorage.setItem('brick-asmr-player-name',name)}catch(e){}
 closeNameModal();setLinks();showToast('Leaderboard name saved');
 const saved=Object.entries(localBest).find(([key,time])=>/^[a-z0-9]{1,16}-(clean|vintage|vapor)(?:-a\d{3,4})?$/.test(key)&&Number.isSafeInteger(time)&&time>0);
 if(saved){try{const res=await fetch('/api/leaderboard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:saved[0],playerId:myId,name:myName,timeMs:saved[1]})});if(!res.ok)throw Error('Not saved');await loadBoard();}catch(e){showToast('Name saved locally; world rankings unavailable');}}
});
P('pnext').onclick=()=>newBoard();
P('pretry').onclick=()=>startBoard();
P('pclose').onclick=()=>hidePanel();
P('pbrag').onclick=()=>{
 const i=boardKey===boardId()?boardRows.findIndex(x=>x.boardKey===boardId()&&x.playerId===myId):-1;
 const t='BRICKS ASMR · '+(isDaily()?'Daily '+seed.slice(1):'Seed '+seed)+' · '+SNAME[style]+'\nTime: '+fmtTime(lastTime)+(i>=0?' · World #'+(i+1):'')+'\nBeat me: '+shareURL();
 copyText(t,'Result copied');
};
P('top').onclick=()=>{if(panelMode)hidePanel();else showPanel('top');};
P('hudMenuToggle').onclick=()=>{const opened=P('hudMenu').hidden;P('hudMenu').hidden=!opened;P('hudMenuToggle').setAttribute('aria-expanded',String(opened));};
function closeMenu(){P('hudMenu').hidden=true;P('hudMenuToggle').setAttribute('aria-expanded','false');}
P('hudMenu').addEventListener('click',e=>{if(!e.target.closest('.midiPick'))closeMenu();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#hudMenu,#hudMenuToggle'))closeMenu();});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!P('nameModal').hidden)closeNameModal();}});
// A mouse click should not leave focus on a HUD button, or Space would trigger it again instead of launching.
P('hud').addEventListener('click',e=>{if(e.detail>0)e.target.closest('button')?.blur();});
resize();startBoard();requestAnimationFrame(frame);
})();
</script>
